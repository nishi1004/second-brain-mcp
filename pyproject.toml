[project]
name = "second-brain-mcp"
version = "0.1.0"
description = "MCP server for Second Brain knowledge layer integration"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"
