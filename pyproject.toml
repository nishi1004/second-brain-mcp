[project]
name = "second-brain-mcp"
version = "0.1.0"
description = "MCP server for Second Brain knowledge layer integration"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
]

[project.scripts]
second-brain-mcp = "second_brain_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["second_brain_mcp.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
